[project]
name = "llmLibrarian"
version = "0.1.0"
description = "Deterministic, locally-hosted context engine (llmli + pal agent CLI)"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    # Core: always required for llmli, pal, and MCP server
    "chromadb>=1.5.5",
    "ollama>=0.1.0",
    "PyYAML>=6.0",
    "pymupdf>=1.23.0",
    "python-docx>=1.0.0",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    "tqdm>=4.66.0",
    "pdfplumber>=0.11.9",
    "typer>=0.21.0",
    "fastmcp>=2.0",
    "sentence-transformers>=2.0.0",
    "watchdog>=6.0.0",
    "setproctitle>=1.3.0",
]

[project.optional-dependencies]
# Image embeddings + vision summaries (llmli add --image-vision)
image = [
    "open-clip-torch>=2.26.1",
    "torch>=2.4.0",
    # Keep torchvision in the project's lock contract instead of relying on
    # open-clip's transitive dependency.  A mismatched ad-hoc torchvision
    # install can import successfully by name but fail while registering ops.
    "torchvision>=0.19.0",
    "Pillow>=10.0.0",
    # Pillow does not decode advertised HEIC/HEIF inputs by itself.
    "pillow-heif>=0.18.0",
]
# OCR for scanned PDFs and image text extraction
ocr = [
    "paddleocr>=3.4.0",
    "tesseract>=0.1.3",
]
# Cross-encoder reranking (LLMLIBRARIAN_RERANK=1) — sentence-transformers in core deps
rerank = []
# File watching for pal watch/pull --watch
watch = [
    "watchdog>=3.0.0",
]
# Adversarial evaluation suite (llmli eval-adversarial)
eval = [
    "evals>=3.0.1.post1",
    "pydantic-evals>=1.58.0",
]
# Everything except build tools
all = [
    "llmLibrarian[image,ocr,rerank,watch,eval]",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]
build = [
    "pyinstaller>=6.0.0",
]

[project.scripts]
llmli = "cli:main"
pal = "pal:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# Editable installs put both the checkout root and src/ on sys.path so
# `import state` / `import cli` work the same as a wheel install.
dev-mode-dirs = [".", "src"]

[tool.hatch.build.targets.wheel]
# Do not ship a top-level `src` package. Modules live at the wheel root so an
# installed `llmli` can `import state` without depending on cwd or path hacks.
# (A stale system install that only dropped cli.py fails with
# ModuleNotFoundError: No module named 'state' — reinstall this wheel to fix.)
packages = []

[tool.hatch.build.targets.wheel.force-include]
"pal.py"          = "pal.py"
"cli.py"          = "cli.py"
"pal_registry.py" = "pal_registry.py"
"pal_daemon.py"   = "pal_daemon.py"
"pal_pull.py"     = "pal_pull.py"
"pal_watch.py"    = "pal_watch.py"
"mcp_server.py"   = "mcp_server.py"
"archetypes.yaml" = "archetypes.yaml"
"src/artifacts.py" = "artifacts.py"
"src/chroma_backend.py" = "chroma_backend.py"
"src/chroma_client.py" = "chroma_client.py"
"src/chroma_lock.py" = "chroma_lock.py"
"src/code_drift.py" = "code_drift.py"
"src/constants.py" = "constants.py"
"src/doc_type_taxonomy.py" = "doc_type_taxonomy.py"
"src/document_read.py" = "document_read.py"
"src/embeddings.py" = "embeddings.py"
"src/env_bootstrap.py" = "env_bootstrap.py"
"src/file_registry.py" = "file_registry.py"
"src/floor.py" = "floor.py"
"src/frontmatter.py" = "frontmatter.py"
"src/geocode.py" = "geocode.py"
"src/image_embeddings.py" = "image_embeddings.py"
"src/ingest_journal.py" = "ingest_journal.py"
"src/jobs_runtime.py" = "jobs_runtime.py"
"src/load_config.py" = "load_config.py"
"src/mcp_contract.py" = "mcp_contract.py"
"src/mcp_result_cache.py" = "mcp_result_cache.py"
"src/model_idle.py" = "model_idle.py"
"src/operations.py" = "operations.py"
"src/operations_find.py" = "operations_find.py"
"src/perf_profile.py" = "perf_profile.py"
"src/processors.py" = "processors.py"
"src/proctitle.py" = "proctitle.py"
"src/query_audit.py" = "query_audit.py"
"src/registry_lock.py" = "registry_lock.py"
"src/reranker.py" = "reranker.py"
"src/scan_patterns.py" = "scan_patterns.py"
"src/silo_audit.py" = "silo_audit.py"
"src/state.py" = "state.py"
"src/style.py" = "style.py"
"src/watch_scan.py" = "watch_scan.py"
"src/watch_telemetry.py" = "watch_telemetry.py"
"src/ingest" = "ingest"
"src/query" = "query"
"src/tax" = "tax"
"src/orchestration" = "orchestration"
"src/llmli_evals" = "llmli_evals"
"src/vision_ocr.swift" = "vision_ocr.swift"
"deploy/systemd/llmlibrarian-mcp@.service" = "deploy/systemd/llmlibrarian-mcp@.service"
"deploy/systemd/llmlibrarian-chroma@.service" = "deploy/systemd/llmlibrarian-chroma@.service"
"deploy/launchd/com.tjm4.llmlibrarian-mcp.plist" = "deploy/launchd/com.tjm4.llmlibrarian-mcp.plist"
"deploy/launchd/com.llmlibrarian.chroma.plist" = "deploy/launchd/com.llmlibrarian.chroma.plist"
"scripts/run_mcp_http.sh" = "scripts/run_mcp_http.sh"
"scripts/run_chroma_server.sh" = "scripts/run_chroma_server.sh"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
markers = [
    "integration: exercises real Chroma/subprocess behavior; slower than unit tests",
]
